# Marketing Dashboard — docker compose
#
#   docker compose up -d --build     → backend + frontend (web: http://localhost:${DOCKER_WEB_PORT:-8088})
#
# PostgreSQL & Redis TIDAK dijalankan di sini: backend memakai server yang sudah ada di mesin host
# (mis. container postgres_db & redis_secure) melalui host.docker.internal.
# Hanya frontend (nginx) yang diekspos; nginx meneruskan /api, /socket.io, /health ke backend lewat jaringan internal docker.
# Semua konfigurasi dibaca dari satu file .env di root.
name: marketing-dashboard

services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    container_name: marketing_backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Kosongkan URL agar dibangun dari POSTGRES_* / REDIS_* dengan host khusus docker
      DATABASE_URL: ''
      REDIS_URL: ''
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-host.docker.internal}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-host.docker.internal}
      APP_URL: http://localhost:${DOCKER_WEB_PORT:-8088}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose: ['3000'] # hanya di jaringan internal docker, tidak dipublikasikan ke host
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_FEATURE_AI_PROMPT_BLOCK: ${VITE_FEATURE_AI_PROMPT_BLOCK:-false}
    container_name: marketing_frontend
    ports: ['${DOCKER_WEB_PORT:-8088}:80']
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
