# Layanan pendukung backend untuk development.
# PostgreSQL memakai container yang sudah ada (postgres_db); di sini hanya Redis.
#   docker compose up -d redis
services:
  redis:
    image: redis:7-alpine
    container_name: matrika_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  api:
    profiles: [full]
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:3000"]
    depends_on: [redis]

volumes:
  redisdata:
